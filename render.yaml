services:
  - type: web
    name: voicebankstudio-openutau-engine
    runtime: docker
    plan: free
    dockerfilePath: ./engine-dotnet/service/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: VOICEBANKSTUDIO_ALLOWED_ORIGINS
        value: https://zulizhiren85-dev.github.io,https://voicebankstudio-preview.onrender.com
