name: OpenUtau Worldline WASM Feasibility

on:
  pull_request:
    paths:
      - ".github/workflows/openutau-worldline-wasm-feasibility.yml"
      - "docs/IPAD_OPENUTAU_PORT.md"
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENUTAU_COMMIT: "08222cb7c48c4ab47faa34a6efc34e2c00898a1e"
  BAZELISK_VERSION: "1.25.0"

jobs:
  inspect-and-build-native-reference:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout VoiceBankStudio
        uses: actions/checkout@v4

      - name: Fetch exact upstream OpenUtau revision
        run: |
          git clone --filter=blob:none https://github.com/openutau/OpenUtau.git "$RUNNER_TEMP/OpenUtau"
          git -C "$RUNNER_TEMP/OpenUtau" checkout "$OPENUTAU_COMMIT"
          test "$(git -C "$RUNNER_TEMP/OpenUtau" rev-parse HEAD)" = "$OPENUTAU_COMMIT"

      - name: Install pinned Bazelisk
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/bazelbuild/bazelisk/releases/download/v${BAZELISK_VERSION}/bazelisk-linux-amd64" \
            --output "$RUNNER_TEMP/bazelisk"
          chmod +x "$RUNNER_TEMP/bazelisk"
          sudo install "$RUNNER_TEMP/bazelisk" /usr/local/bin/bazel
          bazel --version

      - name: Record compiler and upstream build metadata
        working-directory: ${{ runner.temp }}/OpenUtau/cpp
        run: |
          mkdir -p "$RUNNER_TEMP/worldline-probe"
          {
            echo "OpenUtau commit: $OPENUTAU_COMMIT"
            echo
            echo "Bazel version:"
            bazel --version
            echo
            echo "Emscripten toolchain:"
            echo "Pinned emsdk Bazel module 4.0.6 (installed in the WASM build step)"
            echo
            echo "Pinned Bazel version:"
            cat .bazelversion
            echo
            echo "Worldline target definition:"
            cat worldline/BUILD.bazel
          } | tee "$RUNNER_TEMP/worldline-probe/toolchain-and-target.txt"

      - name: Build upstream native Worldline reference
        working-directory: ${{ runner.temp }}/OpenUtau/cpp
        run: |
          bazel build //worldline

      - name: Capture Worldline dependency graph
        working-directory: ${{ runner.temp }}/OpenUtau/cpp
        run: |
          bazel query 'deps(//worldline)' --output=label_kind \
            | sort > "$RUNNER_TEMP/worldline-probe/worldline-dependencies.txt"
          bazel cquery //worldline --output=files \
            > "$RUNNER_TEMP/worldline-probe/native-output-files.txt"

      - name: Prepare pinned Emscripten Bazel target
        working-directory: ${{ runner.temp }}/OpenUtau/cpp
        run: |
          set -euo pipefail
          cat >> WORKSPACE.bazel <<'EOF'

          # Isolated Emscripten toolchain; the upstream OpenUtau checkout remains pinned.
          load("@bazel_tools//tools/build_defs/repo:git.bzl", "git_repository")
          git_repository(
              name = "emsdk",
              remote = "https://github.com/emscripten-core/emsdk.git",
              commit = "24fc909c0da13ef641d5ae75e89b5a97f25e37aa",
              strip_prefix = "bazel",
          )
          load("@emsdk//:deps.bzl", emsdk_deps = "deps")
          emsdk_deps()
          load("@emsdk//:emscripten_deps.bzl", emsdk_emscripten_deps = "emscripten_deps")
          emsdk_emscripten_deps(emscripten_version = "4.0.6")
          load("@emsdk//:toolchains.bzl", "register_emscripten_toolchains")
          register_emscripten_toolchains()
          EOF
          cp "$GITHUB_WORKSPACE/scripts/openutau-worldline-wasm-smoke.cpp" worldline/worldline_wasm_smoke.cpp
          sed -i '1i load("@emsdk//emscripten_toolchain:wasm_rules.bzl", "wasm_cc_binary")' worldline/BUILD.bazel
          cat >> worldline/BUILD.bazel <<'EOF'

          # Experimental browser target: link the synthesis library only.
          # Deliberately omit audio_output_lib / miniaudio device access.
          cc_binary(
              name = "worldline_wasm_smoke_binary",
              srcs = ["worldline_wasm_smoke.cpp"],
              deps = [":worldline_lib"],
              linkopts = [
                  "-sALLOW_MEMORY_GROWTH=1",
                  "-sENVIRONMENT=web,worker,node",
                  "-sMODULARIZE=1",
                  "-sEXPORT_NAME=WorldlineModule",
                  "-sEXPORTED_FUNCTIONS=['_main','_malloc','_free','_F0FrameCount','_F0','_DecodeMgc','_DecodeBap','_InitAnalysisConfig','_WorldAnalysisF0In','_WorldSynthesisSampleCount','_WorldSynthesis','_HnAnalysisF0In','_WorldSynthesisContinuousNoise']",
                  "-sEXPORTED_RUNTIME_METHODS=['ccall','cwrap']",
                  "-sWASM_BIGINT=1",
              ],
          )

          wasm_cc_binary(
              name = "worldline-wasm-smoke",
              cc_target = ":worldline_wasm_smoke_binary",
          )
          EOF

      - name: Build upstream Worldline as WebAssembly
        working-directory: ${{ runner.temp }}/OpenUtau/cpp
        run: |
          set -euo pipefail
          USE_BAZEL_VERSION=7.4.1 bazel --version
          USE_BAZEL_VERSION=7.4.1 bazel --noenable_bzlmod build --incompatible_enable_cc_toolchain_resolution //worldline:worldline-wasm-smoke
          find bazel-bin/worldline -maxdepth 2 -type f -print | sort
          WASM_JS="$(find bazel-bin/worldline -maxdepth 2 -type f -name '*worldline-wasm-smoke*.js' | head -n 1)"
          test -n "$WASM_JS"
          node "$WASM_JS" | tee "$RUNNER_TEMP/worldline-probe/wasm-smoke-output.txt"
          grep -q "WORLDLINE_WASM_SMOKE_OK" "$RUNNER_TEMP/worldline-probe/wasm-smoke-output.txt"
          find bazel-bin/worldline -maxdepth 2 -type f \\( -name '*.wasm' -o -name '*worldline-wasm-smoke*.js' \\) \\
            -exec cp {} "$RUNNER_TEMP/worldline-probe/" \\;

      - name: Upload feasibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openutau-worldline-feasibility
          path: ${{ runner.temp }}/worldline-probe/
          if-no-files-found: warn
