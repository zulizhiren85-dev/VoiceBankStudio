name: Python Audio Engine

on:
  push:
    paths:
      - "engine/**"
      - "server/**"
      - "render.yaml"
      - ".github/workflows/python-audio-engine.yml"
  pull_request:
    paths:
      - "engine/**"
      - ".github/workflows/python-audio-engine.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and build native extension
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install ./engine
          python -m pip install -r server/requirements.txt
      - name: Check API imports
        run: python -c "import server.main"
      - name: Run tests
        working-directory: engine
        run: python -m unittest discover -s tests -v
