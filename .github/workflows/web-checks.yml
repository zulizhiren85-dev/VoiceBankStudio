name: VoiceBankStudio Web Checks

on:
  push:
    paths:
      - "index.html"
      - "voicebank.js"
      - ".github/workflows/web-checks.yml"
  pull_request:
    paths:
      - "index.html"
      - "voicebank.js"
      - ".github/workflows/web-checks.yml"

jobs:
  web-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: node --check voicebank.js
      - name: Check inline app JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          start = html.index("<script>") + len("<script>")
          end = html.index("</script>", start)
          Path("/tmp/voicebankstudio-inline.js").write_text(html[start:end], encoding="utf-8")
          PY
          node --check /tmp/voicebankstudio-inline.js
      - name: Check required beta UI hooks
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          js = Path("voicebank.js").read_text(encoding="utf-8")
          required_html = ["id=\"voicebankBeta\"", "id=\"vbZip\"", "id=\"vbFolder\"", "src=\"voicebank.js?v=vcb-20261122-03\"", "id=\"voicePlay\"", "id=\"analysisToSong\"", "端末内で簡易解析（通信なし）", "Peak：", "pitchFrames", "count=Math.min(240", "multiple", "id=\"serverAnalyzeBatch\"", "function refreshBatchPicker", "uploadAudioFile(f,false,resolve)"]
          required_js = ["oto.ini", "preutterance", "overlap", "DecompressionStream", "webkitRelativePath", "playNotes", "VoiceBankStudioVoicebank", "function aliasKey", "function chooseRow", "row.overlap", "row.preutterance", "\"* \"+target", "\"- \"+target", "\"ん\""]
          missing = [item for item in required_html if item not in html] + [item for item in required_js if item not in js]
          if missing:
              raise SystemExit("Missing beta integration items: " + ", ".join(missing))
          print("VCV alias, pitch, syntax, and integration checks passed.")
          PY
