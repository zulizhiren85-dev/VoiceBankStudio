name: VoiceBankStudio Web Checks

on:
  push:
    paths:
      - "index.html"
      - "voicebank.js"
      - ".github/workflows/web-checks.yml"
  pull_request:
    paths:
      - "index.html"
      - "voicebank.js"
      - ".github/workflows/web-checks.yml"

jobs:
  web-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: node --check voicebank.js
      - name: Check required beta UI hooks
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          js = Path("voicebank.js").read_text(encoding="utf-8")
          required_html = ["id=\"voicebankBeta\"", "id=\"vbZip\"", "id=\"vbFolder\"", "src=\"voicebank.js?v=97e9fd5\"", "id=\"voicePlay\"", "id=\"analysisToSong\""]
          required_js = ["oto.ini", "preutterance", "overlap", "DecompressionStream", "webkitRelativePath", "playNotes", "VoiceBankStudioVoicebank"]
          missing = [item for item in required_html if item not in html] + [item for item in required_js if item not in js]
          if missing:
              raise SystemExit("Missing beta integration items: " + ", ".join(missing))
          print("Voicebank beta integration checks passed.")
          PY
