name: VoiceBankStudio Web Checks

on:
  push:
    paths:
      - "index.html"
      - "voicebank.js"
      - "voicebank-create.js"
      - ".github/workflows/web-checks.yml"
  pull_request:
    paths:
      - "index.html"
      - "voicebank.js"
      - "voicebank-create.js"
      - ".github/workflows/web-checks.yml"

jobs:
  web-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          node --check voicebank.js
          node --check voicebank-create.js
      - name: Check inline app JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          start = html.index("<script>") + len("<script>")
          end = html.index("</script>", start)
          Path("/tmp/voicebankstudio-inline.js").write_text(html[start:end], encoding="utf-8")
          PY
          node --check /tmp/voicebankstudio-inline.js
      - name: Test automatic VCV and CVVC detection
        run: |
          node <<'JS'
          const fs = require("node:fs");
          const vm = require("node:vm");
          const assert = require("node:assert/strict");
          const html = fs.readFileSync("index.html", "utf8");
          const start = html.indexOf("function detectLocalPhonemizer");
          const end = html.indexOf("\n}", start) + 2;
          if (start < 0 || end < 2) throw new Error("detectLocalPhonemizer was not found");
          const detect = vm.runInNewContext(html.slice(start, end) + "; detectLocalPhonemizer");
          assert.equal(detect(["あ", "a か"]).mode, "ja-vcv");
          assert.equal(detect(["あ", "a k"]).mode, "ja-cvvc");
          assert.equal(detect(["あ", "か"]).mode, "ja-vcv");
          console.log("Automatic VCV/CVVC detection tests passed.");
          JS
      - name: Check required beta UI hooks
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          js = Path("voicebank.js").read_text(encoding="utf-8")
          creator_js = Path("voicebank-create.js").read_text(encoding="utf-8")
          required_html = ["id=\"voicebankBeta\"", "id=\"vbZip\"", "id=\"vbFolder\"", "src=\"voicebank.js?v=20261122-800mib1\"", "id=\"voicePlay\"", "id=\"downloadRender\"", "id=\"phonemizer\"", "OPENUTAU_ENGINE_API", "/api/v1/render", "notesJson", "id=\"analysisToSong\"", "id=\"voicebankCreate\"", "id=\"vbCreateRecord\"", "id=\"vbCreateStop\"", "id=\"vbCreateImport\"", "id=\"vbCreateAdd\"", "id=\"vbCreateDownloadOto\"", "src=\"voicebank-create.js?v=20261123-01\"", "端末内で簡易解析（通信なし）", "Peak：", "pitchFrames", "count=Math.min(600", "multiple", "id=\"serverAnalyzeBatch\"", "function refreshBatchPicker", "uploadAudioFile(f,false,resolve)"]
          required_js = ["oto.ini", "preutterance", "overlap", "DecompressionStream", "webkitRelativePath", "playNotes", "getArchiveFile", "VoiceBankStudioVoicebank", "function aliasKey", "function chooseRow", "// Beta playback is monophonic", "const endAt=next?Math.min(nominalEnd,nextStart):nominalEnd;", "\"* \"+target", "\"- \"+target", "\"ん\""]
          required_creator_js = ["function encodeMonoWav", "function makeOtoIni"]
          missing = [item for item in required_html if item not in html] + [item for item in required_js if item not in js] + [item for item in required_creator_js if item not in creator_js]
          if missing:
              raise SystemExit("Missing beta integration items: " + ", ".join(missing))
          print("VCV alias, pitch, syntax, and integration checks passed.")
          PY
